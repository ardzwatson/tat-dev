<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const targetBase = "https://tat-app.b-cdn.net/"; // Replace with your actual Bunny URL
    const repoName = "/reponame";                      // Replace with your actual repository name (leading slash required)

    let currentPath = window.location.pathname;
    
    // Remove repo name from path if present
    if (currentPath.startsWith(repoName)) {
      currentPath = currentPath.substring(repoName.length);
    }

    // Ensure path starts with a slash
    if (!currentPath.startsWith("/")) {
      currentPath = "/" + currentPath;
    }

    window.location.replace(targetBase + currentPath + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <p>Redirecting... <a href="https://tat-app.b-cdn.net/">Click here if not redirected.</a></p>
</body>
</html>
