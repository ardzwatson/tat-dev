name: Deploy PWA to Bunny.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload PWA via Bunny Storage API
        run: |
          curl -X PUT "https://bunnycdn.com{{ secrets.BUNNY_STORAGE_ZONE }}/index.html" \
               -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
               -T "./index.html"
          
          curl -X PUT "https://bunnycdn.com{{ secrets.BUNNY_STORAGE_ZONE }}/manifest.json" \
               -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
               -T "./manifest.json"
          
          curl -X PUT "https://bunnycdn.com{{ secrets.BUNNY_STORAGE_ZONE }}/service-worker.js" \
               -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
               -T "./service-worker.js"
