name: Deploy PWA to Bunny.net

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload PWA via Bunny Storage API
        env:
          BUNNY_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          curl -v -w "\nHTTP Status: %{http_code}\n" -X PUT "https://bunnycdn.com{BUNNY_ZONE}/index.html" \
               -H "AccessKey: ${BUNNY_KEY}" \
               -T "./index.html"
          
          curl -v -w "\nHTTP Status: %{http_code}\n" -X PUT "https://bunnycdn.com{BUNNY_ZONE}/manifest.json" \
               -H "AccessKey: ${BUNNY_KEY}" \
               -T "./manifest.json"
          
          curl -X PUT "https://bunnycdn.com{BUNNY_ZONE}/service-worker.js" \
               -H "AccessKey: ${BUNNY_KEY}" \
               -T "./service-worker.js"
