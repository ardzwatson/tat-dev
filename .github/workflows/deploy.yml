name: Deploy PWA to Bunny.net

on:
  push:
    branches:
      - main  # Runs every time you push code to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Bunny.net Storage
        uses: bunnycloud/storage-deploy-action@v1
        with:
          source: './'  # Uploads your index.html, manifest, and service worker
          storageZone: ${{ secrets.BUNNY_STORAGE_ZONE }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
