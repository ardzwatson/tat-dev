name: Deploy PWA to Bunny.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via FTP to Bunny.net
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: bunnycdn.com
          username: ${{ secrets.BUNNY_STORAGE_ZONE }}
          password: ${{ secrets.BUNNY_API_KEY }}
          local-dir: ./
