name: Deploy PWA to Bunny.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via FTPS to Bunny.net
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 84.17.64.2
          username: ${{ secrets.BUNNY_STORAGE_ZONE }}
          password: ${{ secrets.BUNNY_API_KEY }}
          protocol: ftps
          port: 2121
          local-dir: ./
